name: Build ANIMORA local anime catalog

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-local-catalog.yml"

permissions:
  contents: write

concurrency:
  group: animora-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and build catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, pathlib, datetime
          url = "https://github.com/cedya77/anime-offline-database/releases/download/latest/anime-offline-database.jsonl"
          req = urllib.request.Request(url, headers={"User-Agent": "ANIMORA-catalog-builder/1.0"})
          with urllib.request.urlopen(req, timeout=180) as response:
              raw = response.read().decode("utf-8")
          items = []
          seen = set()
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(row, dict):
                  continue
              title = str(row.get("title") or "").strip()
              sources = row.get("sources") or []
              if not title or not isinstance(sources, list):
                  continue
              key = tuple(sorted(str(s) for s in sources)) if sources else title.casefold()
              if key in seen:
                  continue
              seen.add(key)
              season = row.get("animeSeason") or {}
              if not isinstance(season, dict):
                  season = {}
              score = row.get("score") or {}
              if not isinstance(score, dict):
                  score = {}
              tags = []
              for tag in row.get("tags") or []:
                  name = tag.get("name") if isinstance(tag, dict) else tag
                  if name:
                      tags.append(str(name))
              items.append({
                  "id": len(items) + 1,
                  "title": title,
                  "type": row.get("type") or "TV",
                  "episodes": row.get("episodes"),
                  "status": row.get("status") or "UNKNOWN",
                  "year": season.get("year"),
                  "picture": row.get("picture") or row.get("thumbnail") or "",
                  "score": score.get("arithmeticGeometricMean"),
                  "synonyms": [str(x) for x in (row.get("synonyms") or []) if x][:30],
                  "studios": [str(x) for x in (row.get("studios") or []) if x][:20],
                  "tags": tags,
                  "sources": sources
              })
          if len(items) < 10000:
              raise SystemExit(f"Catalog validation failed: only {len(items)} records")
          output = pathlib.Path("data/catalog.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({
              "source": "anime-offline-database",
              "license": "ODbL-1.0 + DbCL-1.0",
              "attribution": "cedya77/anime-offline-database",
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "count": len(items),
              "items": items
          }, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          size = output.stat().st_size
          if size < 1000000:
              raise SystemExit(f"Catalog file unexpectedly small: {size} bytes")
          print(f"Built {len(items)} anime records; output bytes: {size}")
          import gzip
          compressed = pathlib.Path("data/catalog.json.gz")
          with gzip.open(compressed, "wb", compresslevel=9) as stream:
              stream.write(output.read_bytes())
          compressed_size = compressed.stat().st_size
          if compressed_size < 100000:
              raise SystemExit(f"Compressed catalog unexpectedly small: {compressed_size} bytes")
          print(f"gzip catalog for faster mobile downloads: {compressed_size} bytes")
          PY

      - name: Validate and commit catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/catalog.json")
          db = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(db.get("items"), list) and len(db["items"]) >= 10000
          assert db.get("count") == len(db["items"])
          titles = [str(item.get("title") or "").strip().casefold() for item in db["items"]]
          ids = [item.get("id") for item in db["items"]]
          assert all(titles), "Catalog contains empty titles"
          assert len(ids) == len(set(ids)), "Catalog contains duplicate record IDs"
          assert all(isinstance(item.get("sources", []), list) for item in db["items"]), "Invalid sources field"
          type_counts = {}
          years = []
          with_picture = 0
          for item in db["items"]:
              kind = str(item.get("type") or "UNKNOWN").upper()
              type_counts[kind] = type_counts.get(kind, 0) + 1
              if item.get("picture") or item.get("thumbnail"):
                  with_picture += 1
              year = item.get("year")
              if isinstance(year, int) and 1900 <= year <= 2100:
                  years.append(year)
          duplicate_titles = len(titles) - len(set(titles))
          print("Catalog quality report:")
          print(f"  Unique IDs: {len(set(ids))}")
          print(f"  Duplicate exact titles (not automatically removed): {duplicate_titles}")
          print(f"  Records with poster: {with_picture}/{len(db['items'])}")
          print(f"  Records with plausible year: {len(years)}/{len(db['items'])}")
          print(f"  Types: {json.dumps(type_counts, ensure_ascii=False, sort_keys=True)}")
          compressed = pathlib.Path("data/catalog.json.gz")
          assert compressed.exists() and compressed.stat().st_size > 100000
          print(f"Validated catalog: {len(db['items'])} records, {p.stat().st_size} bytes")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/catalog.json.gz
          if git diff --cached --quiet; then
            echo "Catalog unchanged; nothing to commit."
          else
            git commit -m "Build local anime catalog"
            git pull --rebase origin main
            git push
          fi
